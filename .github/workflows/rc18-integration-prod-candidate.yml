name: RC18 Production Candidate Integration Gate

on:
  push:
    branches:
      - integration/rc18-analytics-payroll-prod-candidate-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merged-release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - run: |
          corepack enable
          corepack prepare pnpm@10.26.0 --activate
      - name: Install reviewed lockfile
        run: pnpm install --frozen-lockfile
      - name: No secrets in isolated CI
        run: |
          if [ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -n "${SUPABASE_SECRET_KEY:-}" ]; then exit 1; fi
      - name: TypeScript whole repo
        run: pnpm exec tsc --noEmit --incremental false
      - name: ESLint whole repo
        run: pnpm run lint
      - name: Full release source inventory (all TS/TSX tests; no silent skips)
        env:
          SHOPEE_SCREENSHOT: e2e/fixtures/shopee-dashboard.jpg
          TIKTOK_SCREENSHOT: e2e/fixtures/tiktok-dashboard.jpg
        run: node scripts/run-final-regression.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Analytics React identity, F5, route, filter, mobile mock browser
        run: pnpm exec playwright test --config playwright.rc18-analytics.config.ts --reporter=line
      - name: Payroll policy preview and no monetary writes mock browser
        run: pnpm exec playwright test --config playwright.rc18-payroll-rules.config.ts --reporter=line
      - name: Existing RC16 multi-module browser regression
        run: pnpm exec playwright test --config playwright.rc16.config.ts --reporter=line
      - name: Production-equivalent Next build without real credentials
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
          FEATURE_ACTUAL_STAFFING: 'false'
          FEATURE_PAYROLL: 'false'
          OPERATIONAL_STORAGE_ROUTING_MODE: database
        run: pnpm run build
      - name: Provenance of this exact integrated candidate
        if: always()
        run: |
          echo "Candidate SHA $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Not Production. No authenticated Preview UAT, no deployment, no DB writes." >> "$GITHUB_STEP_SUMMARY"
