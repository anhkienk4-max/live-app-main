name: RC19 Registration 128 PostgreSQL 17 gate

on:
  push:
    branches: [fix/rc19-reg128-lane1]

permissions:
  contents: read

jobs:
  registration-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact pushed commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start isolated PostgreSQL 17
        run: |
          docker run --detach --rm --name ada-reg02-pg17 --network none \
            -e POSTGRES_PASSWORD=synthetic-only postgres:17.11-bookworm
          for attempt in $(seq 1 30); do
            if docker exec ada-reg02-pg17 pg_isready -U postgres -d postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs ada-reg02-pg17
          exit 1
      - name: Run Registration source contract tests
        run: node --test tests/rc19-reg02-contract.test.mjs
      - name: Run Registration PostgreSQL 17 authorization/concurrency gate
        env:
          REG02_PG_CONTAINER: ada-reg02-pg17
        run: node tests/rc19-reg02-postgres.integration.mjs
      - name: Stop isolated database
        if: always()
        run: docker stop ada-reg02-pg17 || true
      - name: No deployment declaration
        run: 'echo "NO DEPLOY: this workflow only runs synthetic PostgreSQL 17 and source tests."'
