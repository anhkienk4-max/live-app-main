name: RC19 Wave 1 Combined Source Gate (NO DEPLOY)

on:
  push:
    branches:
      - integration/rc19-wave1-candidate
      - integration/rc19-memory-proof
  pull_request:
    branches:
      - integration/rc19-wave1-candidate
      - feat/ops-full-app-upgrade-rc19

permissions:
  contents: read

jobs:
  combined-source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Pin package manager
        run: |
          corepack enable
          corepack prepare pnpm@10.26.0 --activate
      - name: Install reviewed lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Verified candidate SHA: $actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Project Memory validation
        run: pnpm run memory:validate
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Full repository ESLint
        run: pnpm run lint
      - name: Focused Reports and Payroll regressions
        run: >-
          node --import ./tests/typescript-alias-loader.mjs --test
          tests/memory-validator-contract.test.ts
          tests/f10-report-active-user-rls.test.ts
          tests/report-storage-security.test.ts
          tests/report-work-queue.test.ts
          tests/rc19-report-apply-filters.test.ts
          tests/report-history-access.test.ts
          tests/final-report-kpi-filter.test.tsx
          tests/rc19-report01-multiview.test.ts
          tests/rc18-payroll-ada-rulebook.test.ts
          tests/rc18-ada-attendance-link.test.ts
          tests/rc16-workforce-payroll.test.ts
          tests/rc17b-payroll-autocalc.test.ts
      - name: Full repository regression
        env:
          SHOPEE_SCREENSHOT: e2e/fixtures/shopee-dashboard.jpg
          TIKTOK_SCREENSHOT: e2e/fixtures/tiktok-dashboard.jpg
        run: node scripts/run-final-regression.mjs
      - name: Reports Security PostgreSQL 17 role simulation
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -X -v ON_ERROR_STOP=1 -c "SELECT current_setting('server_version_num');"
          psql -X -v ON_ERROR_STOP=1 -f tests/reports-p0/reports-rls-synthetic-fixture.sql > /dev/null
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261023093000_rc19_p0_report_read_ownership_and_revisions.sql > /dev/null
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261023102000_rc19_p0_report_revision_rpc_invoker.sql > /dev/null
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261023103500_rc19_p0_report_revision_invoker_identity_fix.sql > /dev/null
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261024003000_rc19_p0_orphan_live_image_read_rls.sql > /dev/null
          psql -X -v ON_ERROR_STOP=1 -f tests/reports-p0/rc19-reports-role-simulation.sql
      - name: Install Chromium for local mock browser tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Reports mock Playwright (not authenticated UAT)
        run: pnpm exec playwright test --config playwright.rc19-report01.config.ts --reporter=line
      - name: Payroll mock Playwright (not authenticated UAT)
        run: pnpm exec playwright test --config playwright.rc18-payroll-rules.config.ts --reporter=line
      - name: Guarded build with credentials and feature flags disabled
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
          FEATURE_ATTENDANCE_IMPORT: 'false'
          NEXT_PUBLIC_FEATURE_ATTENDANCE_IMPORT: 'false'
          FEATURE_ACTUAL_STAFFING: 'false'
          FEATURE_PAYROLL: 'false'
          OPERATIONAL_STORAGE_ROUTING_MODE: database
        run: pnpm run build
      - name: Gate provenance, NO DEPLOY
        if: always()
        run: |
          echo "Combined RC19 source gate SHA $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "No Vercel Preview/Production deployment, Supabase SQL or data writes are performed by this workflow." >> "$GITHUB_STEP_SUMMARY"
