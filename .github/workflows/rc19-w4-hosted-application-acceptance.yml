            echo "::error::Private Storage object was not denied to an unauthenticated caller (HTTP $denial_status)"; exit 1;
          }
          jq --arg bucket "$bucket" --arg upload "$upload_status" --arg readback "$readback_status" --arg denied "$denial_status" \
            '.steps.storage={status:"passed",synthetic_private_bucket:$bucket,upload_http_status:($upload|tonumber),authorized_readback_http_status:($readback|tonumber),readback_matches_marker:true,unauthenticated_read_denied:true,denial_http_status:($denied|tonumber),scope:"Supabase Storage runtime capability; not Google Drive G11"}' \
            "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" > "$RUNNER_TEMP/storage-evidence.json"
          mv "$RUNNER_TEMP/storage-evidence.json" "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json"
          rm -f "$RUNNER_TEMP/rc19-w4-storage-probe.txt" "$RUNNER_TEMP/storage-readback.txt"

      - name: Build and start Next.js against the marked disposable runtime
        working-directory: rc19-w4-application
        env:
          RUN_BROWSER_UAT: ${{ inputs.run_browser_uat }}
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only }}
          EXPECTED_APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          set -euo pipefail
          [[ -n "${DATABASE_URL:-}" && "$DATABASE_URL" == "$RC19_W4_RUNTIME_DATABASE_URL" ]] || {
            echo "::error::Next.js DATABASE_URL does not match the marked disposable runtime URL"; exit 1;
          }
          database_marker="$(docker exec "$RC19_W4_RUNTIME_DATABASE_CONTAINER" psql -U postgres -d postgres -Atqc \
            "SELECT marker FROM public.rc19_w4_application_runtime_probe WHERE marker='$RC19_W4_RUNTIME_DATABASE_MARKER'")"
          [[ "$database_marker" == "$RC19_W4_RUNTIME_DATABASE_MARKER" ]] || {
            echo "::error::Next.js database binding marker does not match the disposable runtime"; exit 1;
          }
          pnpm run build > "$RUNNER_TEMP/rc19-w4-next-build.log" 2>&1 || {
            echo "::error::Next.js production build failed; raw build output is withheld."; exit 1;
          }
          export RC19_W4_EXPECTED_APPLICATION_SHA="$EXPECTED_APPLICATION_SHA"
          export RC19_W4_NEXT_BASE_URL=http://127.0.0.1:3000
          pnpm run start --hostname 127.0.0.1 --port 3000 \
            > "$RUNNER_TEMP/rc19-w4-next-start.log" 2>&1 &
          next_pid=$!
          cleanup_next() { kill "$next_pid" >/dev/null 2>&1 || true; wait "$next_pid" >/dev/null 2>&1 || true; }
          trap cleanup_next EXIT
          ready=false
          for attempt in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/login || true)"
            if [[ "$status" == "200" ]]; then ready=true; break; fi
            kill -0 "$next_pid" 2>/dev/null || break
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            process_alive=false
            kill -0 "$next_pid" 2>/dev/null && process_alive=true || true
            start_exit_code=""
            if [[ "$process_alive" == false ]]; then
              if wait "$next_pid"; then start_exit_code=0; else start_exit_code=$?; fi
            fi
            python3 - "$RUNNER_TEMP/rc19-w4-next-start.log" "$status" "$process_alive" "$RUNNER_TEMP/rc19-w4-next-failure.json" "$start_exit_code" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          log_path = Path(sys.argv[1])
          raw = log_path.read_bytes() if log_path.exists() else b""
          decoded = raw.decode("utf-8", errors="replace")
          env_guard_codes = sorted(set(re.findall(r"\[ENV GUARD\]\s+([A-Z0-9_]+)", decoded)))
          if env_guard_codes:
              code = env_guard_codes[0]
          elif re.search(r"Invalid project directory", decoded, re.I):
              code = "NEXT_INVALID_PROJECT_DIRECTORY"
          elif re.search(r"Could not find a production build|production build.*not found", decoded, re.I):
              code = "NEXT_PRODUCTION_BUILD_NOT_FOUND"
          elif re.search(r"EADDRINUSE|address already in use", decoded, re.I):
              code = "NEXT_PORT_ALREADY_IN_USE"
          elif re.search(r"ERR_MODULE_NOT_FOUND|Cannot find module", decoded, re.I):
              code = "NEXT_MODULE_LOAD_FAILURE"
          elif sys.argv[3] != "true":
              code = "NEXT_SERVER_PROCESS_EXITED"
          elif sys.argv[2] in {"500", "502", "503", "504"}:
              code = f"NEXT_HTTP_{sys.argv[2]}"
          else:
              code = "NEXT_READINESS_TIMEOUT"
          safe_lines = []
          for line in decoded.splitlines():
              if not line.strip():
                  continue
              safe = re.sub(r"\x1b\[[0-9;]*m", "", line)
              safe = re.sub(r"postgres(?:ql)?://\S+", "[database-url]", safe, flags=re.I)
              safe = re.sub(r"https?://\S+", "[url]", safe)
              safe = re.sub(r"\beyJ[A-Za-z0-9_-]{20,}(?:\.[A-Za-z0-9_-]+){0,2}", "[token]", safe)
              safe = re.sub(r"(?i)\bBearer\s+\S+", "Bearer [redacted]", safe)
              safe = re.sub(r"[\w.+-]+@[\w.-]+", "[email]", safe)
              safe = re.sub(r"(?i)\b(database_url|supabase_service_role_key|service_role_key|anon_key|password|secret|api[_-]?key|token|authorization)\b\s*[:=]\s*\S+", r"\1=[redacted]", safe)
              safe = re.sub(r"/home/runner/work/[^/]+/[^/]+", "[workspace]", safe)
              safe = re.sub(r"\s+", " ", safe).strip()
              safe_lines.append(safe[:300])
          evidence = {
              "status": "failed",
              "stage": "next_readiness",
              "code": code,
              "process_alive": sys.argv[3] == "true",
              "process_exit_code": int(sys.argv[5]) if sys.argv[5].isdigit() else None,
              "readiness_http_status": int(sys.argv[2]) if sys.argv[2].isdigit() else None,
              "environment_guard_codes": env_guard_codes,
              "sanitized_startup_lines": safe_lines[:12],
              "raw_log_sha256": hashlib.sha256(raw).hexdigest(),
              "raw_log_bytes": len(raw),
              "raw_log_in_artifact": False,
          }
          Path(sys.argv[4]).write_text(json.dumps(evidence, separators=(",", ":")))
          PY
            jq --slurpfile next_failure "$RUNNER_TEMP/rc19-w4-next-failure.json" \
              '.steps.next=$next_failure[0]' "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" \
              > "$RUNNER_TEMP/rc19-w4-next-failed.json"
            mv "$RUNNER_TEMP/rc19-w4-next-failed.json" "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json"
            jq -r '"Next.js startup diagnostic: " + .steps.next.code + "; HTTP=" + ((.steps.next.readiness_http_status // "none")|tostring) + "; raw log omitted (sha256 " + .steps.next.raw_log_sha256 + ")"' \
              "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Next.js did not become ready against the disposable Supabase runtime; sanitized failure evidence was recorded."; exit 1
          fi
          jq '.steps.next = {status:"passed",ready:true,readiness_http_status:200,host:"127.0.0.1",port:3000,production_build:true,uses_disposable_runtime_environment:true,application_database_binding_verified:true,database_url_matches_marked_runtime:true,database_marker_matches:true}' \
            "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" \
            > "$RUNNER_TEMP/rc19-w4-app-artifact/next.json"
          mv "$RUNNER_TEMP/rc19-w4-app-artifact/next.json" "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json"

          report="$RUNNER_TEMP/rc19-w4-lane01-acceptance.json"
          if [[ "$DIAGNOSTIC_ONLY" == "true" && "$RUN_BROWSER_UAT" == "true" ]]; then
            echo "::error::Bounded runtime diagnostics cannot request browser UAT"; exit 1
          fi
          if [[ "$RUN_BROWSER_UAT" == "true" ]]; then
            export RC19_W4_RUN_BROWSER_UAT=true
          else
            export RC19_W4_RUN_BROWSER_UAT=false
          fi
          if [[ ! -f scripts/rc19-w4-application-acceptance.mjs ]]; then
            jq '.steps.application = {status:"blocked",code:"LANE01_ACCEPTANCE_ENTRYPOINT_MISSING"}' \
              "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" > "$RUNNER_TEMP/rc19-w4-app-artifact/blocked.json"
            mv "$RUNNER_TEMP/rc19-w4-app-artifact/blocked.json" "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json"
            echo "::error::Lane 01 application acceptance entrypoint is not present in the reviewed application SHA. Runtime startup and migrations were verified; role acceptance remains blocked."
            exit 1
          fi
          set +e
          node scripts/rc19-w4-application-acceptance.mjs > "$report" 2> "$RUNNER_TEMP/rc19-w4-lane01-acceptance.log"
          result=$?
          set -e
          if [[ "$result" -ne 0 ]]; then
            if [[ "$DIAGNOSTIC_ONLY" == "true" ]]; then
              jq '.steps.application = {status:"blocked",code:"DIAGNOSTIC_ENTRYPOINT_FAILED"}' \
                "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" > "$RUNNER_TEMP/rc19-w4-app-artifact/diagnostic-failed.json"
              jq '.scope="application-runtime-diagnostic" | .strict_acceptance=false | .browser_uat_requested=false' \
                "$RUNNER_TEMP/rc19-w4-app-artifact/diagnostic-failed.json" > "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json"
              echo "::warning::The bounded diagnostic entrypoint failed; sanitized runtime evidence is retained."
              exit 0
            fi
            jq '.steps.application = {status:"failed",code:"LANE01_ACCEPTANCE_FAILED"}' \
              "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" > "$RUNNER_TEMP/rc19-w4-app-artifact/failed.json"
            mv "$RUNNER_TEMP/rc19-w4-app-artifact/failed.json" "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json"
            echo "::error::Lane 01 application acceptance failed; raw output is withheld."
            exit "$result"
          fi
          if [[ "$DIAGNOSTIC_ONLY" == "true" ]]; then
            jq -e --arg sha "$EXPECTED_APPLICATION_SHA" --arg marker "$RC19_W4_RUNTIME_DATABASE_MARKER" '
              .schema == "rc19-w4-application-acceptance/v2" and
              .application_sha == $sha and .runtime_database_marker == $marker and
              .synthetic_users.admin.login == true and .synthetic_users.admin.canonical_business_user_mapping == true and
              .synthetic_users.leader.login == true and .synthetic_users.leader.canonical_business_user_mapping == true and
              .synthetic_users.member.login == true and .synthetic_users.member.canonical_business_user_mapping == true
            ' "$report" > /dev/null || {
              jq '.steps.application = {status:"blocked",code:"DIAGNOSTIC_REPORT_INVALID"}' \
                "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" > "$RUNNER_TEMP/rc19-w4-app-artifact/diagnostic-invalid.json"
              jq '.scope="application-runtime-diagnostic" | .strict_acceptance=false | .browser_uat_requested=false' \
                "$RUNNER_TEMP/rc19-w4-app-artifact/diagnostic-invalid.json" > "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json"
              echo "::warning::The diagnostic report did not prove exact-SHA Auth and canonical identity; strict acceptance remains unrun."
              exit 0
            }
            jq --arg sha "$EXPECTED_APPLICATION_SHA" --arg marker "$RC19_W4_RUNTIME_DATABASE_MARKER" '
              {mode:"bounded-runtime-diagnostic",schema,status:.status,application_sha:$sha,
               runtime_database_marker_match:(.runtime_database_marker == $marker),
               synthetic_users,authorization,browser_uat,
               cases:[.cases[]|{case_id,status,evidence_scope}],
               fixtures:{authenticated_users:.fixtures.authenticated_users,brands:.fixtures.brands,
                 platforms:.fixtures.platforms,parent_shifts:.fixtures.parent_shifts,
                 staffing_segments:.fixtures.staffing_segments,canonical_assignments:.fixtures.canonical_assignments,
                 wrong_brand_denied:.fixtures.wrong_brand_denied,unassigned_member_has_no_assignment:.fixtures.unassigned_member_has_no_assignment,
                 wrong_agency_denial:.fixtures.wrong_agency_denial,anonymous_denied:.fixtures.anonymous_denied}}
            ' "$report" > "$RUNNER_TEMP/rc19-w4-app-artifact/lane01-acceptance.json"
            jq --slurpfile app "$RUNNER_TEMP/rc19-w4-app-artifact/lane01-acceptance.json" \
              '.scope="application-runtime-diagnostic" | .strict_acceptance=false | .browser_uat_requested=false | .steps.application = {status:"diagnostic",evidence:$app[0]}' \
              "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" > "$RUNNER_TEMP/rc19-w4-app-artifact/diagnostic.json"
            mv "$RUNNER_TEMP/rc19-w4-app-artifact/diagnostic.json" "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json"
            echo "Bounded diagnostic completed. Strict business acceptance and browser UAT were not run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq --arg browser_requested "$RUN_BROWSER_UAT" -e '
            .schema == "rc19-w4-application-acceptance/v2" and
            .status == "passed" and
            .synthetic_users.admin.login == true and .synthetic_users.admin.canonical_business_user_mapping == true and
            .synthetic_users.leader.login == true and .synthetic_users.leader.canonical_business_user_mapping == true and
            .synthetic_users.member.login == true and .synthetic_users.member.canonical_business_user_mapping == true and
            .database_binding.runtime_marker_match == true and
            .database_binding.application_target_match == true and
            .next_app.ready == true and
            ((.browser_uat.ran == true and .browser_uat.passed == true and .browser_uat.authenticated == true and .browser_uat.interaction_count > 0) or
              ($browser_requested == "false" and .browser_uat.ran == false and .browser_uat.passed == false)) and
            (.business_cases | type == "array" and length > 0) and
            (([.business_cases[].area] | unique | sort) == [
              "atomic_staffing_replacement", "attendance_segment_boundaries", "brand_agency_authorization_boundaries",
              "calendar_shift_creation", "external_summary", "import_staffing_updates", "live_monitoring_authorization",
              "operational_notes_lifecycle", "pass_swap_lifecycle", "report_revision_snapshots", "segmented_staffing",
              "shift_registration", "storage_authorization_upload_readback", "temporal_payroll", "workforce_reporting"
            ]) and
            (([.business_cases[].source_case_ids[]] | unique) as $source_cases |
              ((["D01","D02","D03","D04","D05","D06","D07","D08","D09","D10","D11",
                 "L01","L02","L03","L04","L05","L06","L07","L08","L09","L10","L11","L12","L13","L14","L15"] - $source_cases) | length == 0)) and
            (([.business_cases[].source_criteria[] | {key:.id,value:.criterion}] | from_entries) as $criteria |
              ($criteria | keys | sort) == ["L01","L02","L03","L04","L05","L06","L07","L08","L09","L10","L11","L12","L13","L14","L15"] and
              $criteria.L01 == "save_link_db_readback_reload_other_account_stale_write" and
              $criteria.L02 == "publisher_consent_and_actual_video" and
              $criteria.L03 == "publisher_shift_a_b_a_continuity" and
              $criteria.L04 == "publisher_reports_navigation_continuity" and
              $criteria.L05 == "independent_admin_receives_changing_frames" and
              $criteria.L06 == "independent_leader_receives_changing_frames" and
              $criteria.L07 == "member_receives_only_permitted_shift_media" and
              $criteria.L08 == "anonymous_wrong_scope_and_direct_media_denial" and
              $criteria.L09 == "viewer_reload_reconnect_without_stopping_publisher" and
              $criteria.L10 == "concurrent_room_isolation_and_duplicate_publisher_guard" and
              $criteria.L11 == "publisher_stop_ends_viewer_and_releases_resources" and
              $criteria.L12 == "capture_browser_network_interruption_and_consent_restart" and
              $criteria.L13 == "token_expiry_revocation_logout_and_termination" and
              $criteria.L14 == "privacy_no_recording_and_audio_when_available" and
              $criteria.L15 == "live_reports_calendar_shift_obs_regression_and_resource_metrics") and
            ([.business_cases[] | ([.source_criteria[].id] - .source_case_ids | length == 0)] | all) and
            ([.business_cases[] |
              (.case_id | type == "string" and length > 0) and
              (.actor.role | type == "string" and length > 0) and
              (.actor.scope_key | type == "string" and length > 0) and
              (.expected.authorization | type == "string" and length > 0) and
              (.expected.result | type == "string" and length > 0) and
              ((.actual.http_status | type == "number") or (.actual.rpc_code | type == "string")) and
              .database_readback.status == "passed" and .database_readback.matches_expected == true and
              .negative_authorization.tested == true and .negative_authorization.passed == true and
              (.source_criteria | type == "array" and length > 0) and
              .status == "passed"] | all) and
            (([.business_cases[].case_id] | unique | length) == (.business_cases | length))
          ' "$report" > /dev/null || {
            jq '.steps.application = {status:"failed",code:"LANE01_ACCEPTANCE_CONTRACT_INVALID"}' \
              "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" > "$RUNNER_TEMP/rc19-w4-app-artifact/failed.json"
            mv "$RUNNER_TEMP/rc19-w4-app-artifact/failed.json" "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json"
            echo "::error::Lane 01 report lacked authenticated Next.js, database readback, per-case authorization or original D/L acceptance evidence"
            exit 1
          }
          jq -c '{schema,status,synthetic_users:{admin:{login:.synthetic_users.admin.login,mapping:.synthetic_users.admin.canonical_business_user_mapping},leader:{login:.synthetic_users.leader.login,mapping:.synthetic_users.leader.canonical_business_user_mapping},member:{login:.synthetic_users.member.login,mapping:.synthetic_users.member.canonical_business_user_mapping}},database_binding:{runtime_marker_match:.database_binding.runtime_marker_match,application_target_match:.database_binding.application_target_match},next_app:{ready:.next_app.ready,readiness_http_status:.next_app.readiness_http_status,authenticated_browser:.next_app.authenticated_browser},browser_uat:{ran:.browser_uat.ran,passed:.browser_uat.passed,authenticated:.browser_uat.authenticated,interaction_count:.browser_uat.interaction_count},business_cases:[.business_cases[]|{case_id,area,source_case_ids,source_criteria,actor:{role:.actor.role,scope_key:.actor.scope_key},expected:{authorization:.expected.authorization,result:.expected.result},actual:{http_status:.actual.http_status,rpc_code:.actual.rpc_code},database_readback:{status:.database_readback.status,matches_expected:.database_readback.matches_expected},negative_authorization:{tested:.negative_authorization.tested,passed:.negative_authorization.passed},browser_interaction:{performed:.browser_interaction.performed,authenticated:.browser_interaction.authenticated,status:.browser_interaction.status},status}]}' "$report" \
            > "$RUNNER_TEMP/rc19-w4-app-artifact/lane01-acceptance.json"

      - name: Verify authenticated Realtime delivery against scoped synthetic shift
        if: inputs.diagnostic_only
        working-directory: rc19-w4-application
        run: |
          set -euo pipefail
          export REALTIME_URL="$RC19_W4_RUNTIME_URL"
          export REALTIME_ANON_KEY="$RC19_W4_RUNTIME_ANON_KEY"
          export REALTIME_SERVICE_KEY="$RC19_W4_RUNTIME_SERVICE_ROLE_KEY"
          export REALTIME_MEMBER_EMAIL="$RC19_W4_SYNTHETIC_MEMBER_EMAIL"
          export REALTIME_MEMBER_PASSWORD="$RC19_W4_SYNTHETIC_MEMBER_PASSWORD"
          export REALTIME_MARKER="$RC19_W4_RUNTIME_DATABASE_MARKER"
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js'

          const fail = code => { process.stderr.write(`${code}\n`); process.exit(1) }
          const withTimeout = (promise, code) => Promise.race([
            promise,
            new Promise((_, reject) => setTimeout(() => reject(new Error(code)), 15000)),
          ])
          const url = process.env.REALTIME_URL
          const member = createClient(url, process.env.REALTIME_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } })
          const service = createClient(url, process.env.REALTIME_SERVICE_KEY, { auth: { persistSession: false, autoRefreshToken: false } })
          const login = await member.auth.signInWithPassword({ email: process.env.REALTIME_MEMBER_EMAIL, password: process.env.REALTIME_MEMBER_PASSWORD })
          if (login.error || !login.data.session) fail('REALTIME_SYNTHETIC_MEMBER_LOGIN_FAILED')
          const found = await service.from('shifts').select('id').like('title', 'RC19 acceptance % scoped').limit(1).maybeSingle()
          if (found.error || !found.data?.id) fail('REALTIME_SCOPED_SHIFT_FIXTURE_MISSING')
          const visible = await member.from('shifts').select('id').eq('id', found.data.id).maybeSingle()
          if (visible.error || visible.data?.id !== found.data.id) fail('REALTIME_MEMBER_SCOPE_READ_FAILED')
          const markerTitle = `RC19 diagnostic ${process.env.REALTIME_MARKER}`
          let resolveEvent
          const event = new Promise(resolve => { resolveEvent = resolve })
          const channel = member.channel(`rc19-w4-diagnostic-${process.env.REALTIME_MARKER}`)
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'shifts', filter: `id=eq.${found.data.id}` }, payload => {
              if (payload.new?.title === markerTitle) resolveEvent(true)
            })
          const subscribed = new Promise((resolve, reject) => channel.subscribe(status => {
            if (status === 'SUBSCRIBED') resolve(true)
            if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') reject(new Error('REALTIME_SUBSCRIPTION_FAILED'))
          }))
          try {
            await withTimeout(subscribed, 'REALTIME_SUBSCRIPTION_TIMEOUT')
            const changed = await service.from('shifts').update({ title: markerTitle }).eq('id', found.data.id).select('id').maybeSingle()
            if (changed.error || changed.data?.id !== found.data.id) fail('REALTIME_SYNTHETIC_UPDATE_FAILED')
            await withTimeout(event, 'REALTIME_EVENT_TIMEOUT')
          } catch (error) {
            fail(error.message === 'REALTIME_EVENT_TIMEOUT' ? 'REALTIME_EVENT_TIMEOUT' : 'REALTIME_EVENT_DELIVERY_FAILED')
          } finally {
            await member.removeChannel(channel)
            await member.auth.signOut()
          }
          process.stdout.write('Authenticated member received the scoped shift update over Realtime.\n')
          NODE
          jq '.steps.realtime={status:"passed",authenticated_member:true,authorized_scoped_shift:true,event_delivered:true,synthetic_update_readback:true}' \
            "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" > "$RUNNER_TEMP/realtime-evidence.json"
          mv "$RUNNER_TEMP/realtime-evidence.json" "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json"

      - name: Merge sanitized runtime and application acceptance evidence
        if: always()
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" && -f "$RUNNER_TEMP/rc19-w4-app-artifact/lane01-acceptance.json" ]]; then
            jq -s '.[0] * {steps: (.[0].steps + {application: .[1]})}' \
              "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" \
              "$RUNNER_TEMP/rc19-w4-app-artifact/lane01-acceptance.json" \
              > "$RUNNER_TEMP/rc19-w4-app-artifact/combined.json"
            mv "$RUNNER_TEMP/rc19-w4-app-artifact/combined.json" "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json"
          fi

      - name: Upload sanitized application acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc19-w4-application-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/rc19-w4-app-artifact/acceptance.json
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup job-local Supabase runtime
        if: always()
        run: |
          if [[ -x "$RUNNER_TEMP/supabase-cli/supabase" && -d "$GITHUB_WORKSPACE/rc19-w4-application/supabase" ]]; then
            cd "$GITHUB_WORKSPACE/rc19-w4-application"
            "$RUNNER_TEMP/supabase-cli/supabase" stop --no-backup >/dev/null 2>&1 || true
          fi
