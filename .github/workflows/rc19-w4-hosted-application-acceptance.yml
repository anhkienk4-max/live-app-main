name: RC19 W4 Hosted Application Acceptance (No Deploy)

on:
  workflow_call:
    inputs:
      harness_sha:
        description: Exact reviewed commit containing this reusable workflow and application SHA allowlist
        required: true
        type: string
      application_sha:
        description: Exact reviewed application candidate SHA listed in the harness allowlist
        required: true
        type: string
      run_browser_uat:
        description: Require authenticated browser acceptance from the reviewed candidate
        required: false
        default: false
        type: boolean
      diagnostic_only:
        description: Run the bounded runtime diagnostic without strict business acceptance or browser UAT
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rc19-w4-app-acceptance-${{ inputs.application_sha }}
  cancel-in-progress: false

jobs:
  hosted-application-acceptance:
    name: Reviewed candidate on fresh job-local Supabase runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact harness commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.harness_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Initialize sanitized application acceptance manifest
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/rc19-w4-app-artifact"
          printf '{"scope":"application-acceptance","deployment":false,"steps":{}}\n' > "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json"

      - name: Assert harness SHA and approved application SHA
        env:
          EXPECTED_HARNESS_SHA: ${{ inputs.harness_sha }}
          EXPECTED_APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          set -euo pipefail
          harness_sha="$(git rev-parse HEAD)"
          valid_sha() { [[ ${#1} -eq 40 && "$1" != *[!0-9a-f]* ]]; }
          valid_sha "$EXPECTED_HARNESS_SHA"
          valid_sha "$EXPECTED_APPLICATION_SHA"
          [[ "$harness_sha" == "$EXPECTED_HARNESS_SHA" ]]
          approved_sha="$(tr -d '[:space:]' < .github/rc19-w4-reviewed-application.sha)"
          valid_sha "$approved_sha"
          [[ "$EXPECTED_APPLICATION_SHA" == "$approved_sha" ]] || {
            echo "::error::Application SHA is not the reviewed candidate pinned by this harness"; exit 1;
          }

      - name: Checkout exact reviewed application candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.application_sha }}
          path: rc19-w4-application
          persist-credentials: false
          fetch-depth: 1

      - name: Verify candidate checkout and application acceptance contract
        working-directory: rc19-w4-application
        env:
          EXPECTED_APPLICATION_SHA: ${{ inputs.application_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_APPLICATION_SHA" ]]
          [[ -d supabase/migrations ]] || { echo "::error::Reviewed candidate has no canonical Supabase migrations"; exit 1; }
          [[ -f supabase/config.toml ]] || { echo "::error::Reviewed candidate has no Supabase CLI config"; exit 1; }
          [[ -f pnpm-lock.yaml ]] || { echo "::error::Reviewed candidate has no frozen pnpm lockfile"; exit 1; }
          if grep -R -n -i -E '(^|[[:space:]])(create|alter|drop)[[:space:]]+(table|schema)[[:space:]]+(if[[:space:]]+(not[[:space:]]+)?exists[[:space:]]+)?auth\.' supabase/migrations; then
            echo "::error::Candidate migrations include direct managed Auth schema DDL"; exit 1;
          fi

      - name: Set up pinned Node and pnpm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'

      - name: Install frozen application dependencies
        working-directory: rc19-w4-application
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.26.0 --activate
          pnpm install --frozen-lockfile

      - name: Install checksum-pinned Supabase CLI 3.4.0
        env:
          CLI_SHA256: d82f8fc8a1611c45b9422b10378f61df614325f7e25624acda3704544513d6ac
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/supabase_3.4.0_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/supabase/cli/releases/download/v3.4.0/supabase_3.4.0_linux_amd64.tar.gz \
            --output "$archive"
          echo "$CLI_SHA256  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/supabase-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/supabase-cli" supabase
          echo "$RUNNER_TEMP/supabase-cli" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/supabase-cli/supabase" --version

      - name: Start marked runtime and apply canonical migrations locally
        working-directory: rc19-w4-application
        env:
          EXPECTED_APPLICATION_SHA: ${{ inputs.application_sha }}
          RUN_MARKER: RC19_W4_APPLICATION_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          project_id="rc19-w4-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          canonical_migrations="$RUNNER_TEMP/rc19-w4-canonical-migrations"
          bridge_version=20261011092014
          bridge_filename="${bridge_version}_rc15_disposable_production_rpc_baseline_bridge.sql"
          sto02_bridge_version=20261103195518
          sto02_bridge_filename="${sto02_bridge_version}_rc19_w4_disposable_sto02_baseline_bridge.sql"
          sto02_baseline_source="$GITHUB_WORKSPACE/supabase/proposals/rc19-sto02-resource-registry/20261027150000_rc19_sto02_resource_registry.sql"
          staffing_bridge_version=20261108135225
          staffing_bridge_filename="${staffing_bridge_version}_rc19_w4_disposable_staffing_rpc_predecessor_bridge.sql"
          staffing_baseline_source="$canonical_migrations/20261022165655_rc19_1b3_staffing_candidate_page_before_conflict.sql"
          python3 - "$project_id" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("supabase/config.toml")
          text = path.read_text()
          values = {
              "project_id": f'"{sys.argv[1]}"',
              "api.port": "55421",
              "db.port": "55432",
              "db.shadow_port": "55430",
              "db.seed.enabled": "false",
              "studio.port": "55423",
              "inbucket.port": "55424",
          }
          for dotted, value in values.items():
              parts = dotted.split(".")
              key = parts[-1]
              section = ".".join(parts[:-1])
              if not section:
                  pattern = rf"(?m)^\s*{re.escape(key)}\s*=.*$"
              else:
                  section_match = re.search(rf"(?ms)^\[{re.escape(section)}\]\n(.*?)(?=^\[|\Z)", text)
                  if not section_match:
                      if dotted == "inbucket.port":
                          continue
                      raise SystemExit(f"Missing Supabase config section: {section}")
                  body = section_match.group(1)
                  key_pattern = rf"(?m)^\s*{re.escape(key)}\s*=.*$"
                  if not re.search(key_pattern, body):
                      if dotted == "inbucket.port":
                          continue
                      raise SystemExit(f"Missing Supabase config key: {dotted}")
                  updated = re.sub(key_pattern, f"{key} = {value}", body, count=1)
                  text = text[:section_match.start(1)] + updated + text[section_match.end(1):]
                  continue
              if not re.search(pattern, text):
                  raise SystemExit(f"Missing Supabase config key: {key}")
              text = re.sub(pattern, f"{key} = {value}", text, count=1)
          path.write_text(text)
          PY
          test ! -e supabase/.temp/project-ref || { echo "::error::Unexpected linked Supabase project state"; exit 1; }
          capture_supabase_start_failure() {
            local log_file="$1" stage="$2"
            local containers_file="$RUNNER_TEMP/rc19-w4-failed-containers.txt"
            local evidence_file="$RUNNER_TEMP/rc19-w4-startup-failure.json"
            local receipts_file="$RUNNER_TEMP/rc19-w4-failed-migration-receipts.txt"
            local receipts_status="not_verified"
            docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}' > "$containers_file" || true
            : > "$receipts_file"
            if [[ -n "${database_container_id:-}" ]] && docker inspect "$database_container_id" >/dev/null 2>&1; then
              if docker exec "$database_container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -Atq \
                -c 'SELECT version FROM supabase_migrations.schema_migrations ORDER BY version' > "$receipts_file" 2>/dev/null; then
                receipts_status="verified"
              fi
            fi
            python3 - "$log_file" "$stage" "$containers_file" "$evidence_file" "$canonical_migrations" "$receipts_file" "$receipts_status" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          log_path = Path(sys.argv[1])
          stage = sys.argv[2]
          containers_path = Path(sys.argv[3])
          output_path = Path(sys.argv[4])
          migrations_root = Path(sys.argv[5])
          receipts_path = Path(sys.argv[6])
          receipts_status = sys.argv[7]
          raw = log_path.read_bytes() if log_path.exists() else b""
          decoded = raw.decode("utf-8", errors="replace")
          patterns = [
              (r"no space left on device|disk quota exceeded", "HOSTED_RUNNER_DISK_CAPACITY"),
              (r"port is already allocated|address already in use|bind:.*in use", "HOST_PORT_COLLISION"),
              (r"manifest unknown|pull access denied|failed to resolve reference", "CONTAINER_IMAGE_UNAVAILABLE"),
              (r"error during connect|cannot connect to the docker daemon|docker daemon.*unavailable", "DOCKER_RUNTIME_UNAVAILABLE"),
              (r"migration.*(failed|error)|failed.*migration|sqlstate", "APPLICATION_MIGRATION_FAILED"),
              (r"health check.*(failed|timeout)|unhealthy|context deadline exceeded|timed out", "SUPABASE_CONTAINER_START_TIMEOUT"),
          ]
          code = next((label for pattern, label in patterns if re.search(pattern, decoded, re.I)), "UNCLASSIFIED_SUPABASE_START_FAILURE")
          filename_pattern = r"\b\d{14}_[A-Za-z0-9_.-]+\.sql\b"
          observed_files = sorted(set(re.findall(filename_pattern, decoded)))
          failed_files = sorted(set(
              filename
              for line in decoded.splitlines()
              if re.search(r"migration|sql|apply", line, re.I)
              and re.search(r"failed|failure|error|could not|unable", line, re.I)
              for filename in re.findall(filename_pattern, line)
          ))
          sqlstates = sorted(set(re.findall(r"SQLSTATE(?:\s|:|=)+([0-9A-Z]{5})", decoded, re.I)))
          migrations = []
          for path in sorted(migrations_root.glob("*.sql"), key=lambda item: item.name):
              migrations.append({
                  "filename": path.name,
                  "version": path.name.split("_", 1)[0],
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          error_tokens = sorted(set(re.findall(
              r"\b(?:RC\d{1,2}_[A-Z0-9_]+|C2_[A-Z0-9_]+|STAFFING_[A-Z0-9_]+|OPERATIONAL_SETTINGS_NOT_CONFIGURED)\b",
              decoded,
          )))
          sanitized_errors = []
          for line in decoded.splitlines():
              if not re.search(r"\b(?:ERROR|FATAL):", line, re.I):
                  continue
              safe = re.sub(r"\x1b\[[0-9;]*m", "", line)
              safe = re.sub(r"'(?:''|[^'])*'", "[literal]", safe)
              safe = re.sub(r'"(?:\\.|[^"\\])*"', "[identifier]", safe)
              safe = re.sub(r"https?://\S+", "[url]", safe)
              safe = re.sub(r"[\w.+-]+@[\w.-]+", "[email]", safe)
              safe = re.sub(r"\s+", " ", safe).strip()
              sanitized_errors.append(safe[:300])
          ledger_versions = [line.strip() for line in receipts_path.read_text().splitlines() if line.strip()]
          token_sources = {
              token: [item["filename"] for item in migrations
                      if token in (migrations_root / item["filename"]).read_text()]
              for token in error_tokens
          }
          unique_token_sources = sorted(set(
              filename for filenames in token_sources.values() for filename in filenames
          ))
          containers = []
          for line in containers_path.read_text().splitlines() if containers_path.exists() else []:
              parts = line.split("|", 2)
              if len(parts) == 3:
                  containers.append({"name": parts[0], "image": parts[1], "status": parts[2]})
          evidence = {
              "status": "failed",
              "stage": stage,
              "code": code,
              "raw_log_sha256": hashlib.sha256(raw).hexdigest(),
              "raw_log_bytes": len(raw),
              "raw_log_lines": len(decoded.splitlines()),
              "raw_log_in_artifact": False,
              "candidate_migrations": migrations,
              "candidate_migration_count": len(migrations),
              "log_observed_migration_filenames": observed_files,
              "last_log_observed_migration_filename": observed_files[-1] if observed_files else None,
              "failed_migration_filenames": failed_files,
              "sqlstates": sqlstates,
              "log_error_tokens": error_tokens,
              "error_token_migration_sources": token_sources,
              "failure_migration_candidate": unique_token_sources[0] if len(unique_token_sources) == 1 else None,
              "failure_candidate_status": "single_source_match" if len(unique_token_sources) == 1 else "unresolved",
              "sanitized_error_lines": sanitized_errors[:12],
              "executed_ledger_receipts": {
                  "status": receipts_status,
                  "versions": ledger_versions if receipts_status == "verified" else [],
                  "count": len(ledger_versions) if receipts_status == "verified" else None,
              },
              "container_states": containers,
          }
          output_path.write_text(json.dumps(evidence, separators=(",", ":")))
          PY
            jq --slurpfile startup "$evidence_file" '.steps.startup=$startup[0]' \
              "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" > "$RUNNER_TEMP/rc19-w4-startup-manifest.json"
            mv "$RUNNER_TEMP/rc19-w4-startup-manifest.json" "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json"
            jq -r '"Supabase startup diagnostic: " + .steps.startup.code + " at " + .steps.startup.stage + "; raw log omitted (sha256 " + .steps.startup.raw_log_sha256 + ")"' \
              "$RUNNER_TEMP/rc19-w4-app-artifact/acceptance.json" >> "$GITHUB_STEP_SUMMARY"
          }
          # Supabase startup normally auto-applies migrations. Keep this job-local
          # runtime empty until we can reproduce the verified pre-RC15 baseline.
          mv supabase/migrations "$canonical_migrations"
          mkdir -p supabase/migrations
          supabase start > "$RUNNER_TEMP/rc19-w4-app-start.log" 2>&1 || {
            capture_supabase_start_failure "$RUNNER_TEMP/rc19-w4-app-start.log" "fresh_start"
            echo "::error::Fresh candidate Supabase stack failed during fresh_start; sanitized evidence was recorded."; exit 1;
          }
          database_container="supabase_db_${project_id}"
          database_container_id="$(docker ps --filter "name=^/${database_container}$" --format '{{.ID}}')"
          [[ -n "$database_container_id" ]] || { echo "::error::Unique candidate database container is missing"; exit 1; }
          python3 - "$canonical_migrations" "$RUNNER_TEMP/rc19-w4-rc15-predecessors.txt" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          paths = sorted(source.glob("*.sql"), key=lambda item: item.name)
          target = "20261011092015_rc15_shift_rpc_compatibility.sql"
          names = [path.name for path in paths]
          if target not in names:
              raise SystemExit("Canonical RC15 target migration is missing")
          target_index = names.index(target)
          if target_index == 0 or names[target_index - 1] != "20261011091925_rc15_storage_route_prerequisites.sql":
              raise SystemExit("Canonical RC15 predecessor ordering changed; bridge placement needs review")
          predecessors = paths[:target_index]
          if not predecessors:
              raise SystemExit("No canonical migrations precede RC15")
          Path(sys.argv[2]).write_text("\n".join(path.name for path in predecessors) + "\n")
          for path in predecessors:
              (Path("supabase/migrations") / path.name).write_bytes(path.read_bytes())
          PY
          supabase db push --skip-vault > "$RUNNER_TEMP/rc19-w4-pre-rc15-migrations.log" 2>&1 || {
            capture_supabase_start_failure "$RUNNER_TEMP/rc19-w4-pre-rc15-migrations.log" "canonical_pre_rc15_migrations"
            echo "::error::Canonical predecessor migrations failed in the disposable runtime; sanitized evidence was recorded."; exit 1;
          }
          predecessor_count="$(wc -l < "$RUNNER_TEMP/rc19-w4-rc15-predecessors.txt" | tr -d '[:space:]')"
          [[ "$predecessor_count" =~ ^[0-9]+$ && "$predecessor_count" -gt 0 ]]
          predecessor_receipts="$(docker exec "$database_container_id" psql -U postgres -d postgres -Atqc 'SELECT count(*) FROM supabase_migrations.schema_migrations')"
          [[ "$predecessor_receipts" == "$predecessor_count" ]] || {
            echo "::error::Pre-RC15 database ledger does not match the canonical predecessor batch"; exit 1;
          }
          # This is a disposable-only bridge. Its bytes are copied unchanged from
          # the reviewed, production-derived fixture; its receipt belongs only to
          # this synthetic runtime and is reported separately from canonical replay.
          echo '5d888b0617921d0ac1b23595002d740ef70535bc1beb35cbb0d087f0ea5dced8  tests/fixtures/rc15_production_shift_rpc_baseline.sql' | sha256sum --check
          cp tests/fixtures/rc15_production_shift_rpc_baseline.sql "supabase/migrations/$bridge_filename"
          supabase db push --skip-vault > "$RUNNER_TEMP/rc19-w4-rc15-baseline-bridge.log" 2>&1 || {
            capture_supabase_start_failure "$RUNNER_TEMP/rc19-w4-rc15-baseline-bridge.log" "disposable_rc15_baseline_bridge"
            echo "::error::Disposable RC15 baseline bridge failed; sanitized evidence was recorded."; exit 1;
          }
          bridge_receipt="$(docker exec "$database_container_id" psql -U postgres -d postgres -Atqc "SELECT count(*) FROM supabase_migrations.schema_migrations WHERE version='$bridge_version'")"
          [[ "$bridge_receipt" == 1 ]] || { echo "::error::Disposable baseline bridge receipt is missing"; exit 1; }
          docker exec "$database_container_id" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -At -F '|' -c "
            SELECT p.oid::regprocedure::text, md5(pg_get_functiondef(p.oid)), p.prosecdef,
              coalesce(array_to_string(p.proconfig,','),'∅'), pg_get_userbyid(p.proowner),
              coalesce(pg_get_expr(p.proargdefaults,0),'∅'),
              has_function_privilege('authenticated',p.oid,'EXECUTE'),
              has_function_privilege('service_role',p.oid,'EXECUTE'),
              has_function_privilege('anon',p.oid,'EXECUTE'),
              exists(select 1 from aclexplode(p.proacl) a where a.grantee=0 and a.privilege_type='EXECUTE')
            FROM pg_proc p WHERE p.oid IN (
              'public.create_shift(jsonb)'::regprocedure,
              'public.update_shift(text,jsonb,boolean)'::regprocedure,
              'public.update_shift(text,jsonb,boolean,integer)'::regprocedure)
            ORDER BY p.oid::regprocedure::text" > "$RUNNER_TEMP/rc19-w4-rc15-baseline-contract.txt"
          python3 - "$RUNNER_TEMP/rc19-w4-rc15-baseline-contract.txt" <<'PY'
          from pathlib import Path
          import sys

          actual = Path(sys.argv[1]).read_text().strip().splitlines()
          expected = [
              "create_shift(jsonb)|2133950d90a0610b76d4b6623abf4621|t|search_path=\"\"|postgres|∅|t|t|f|f",
              "update_shift(text,jsonb,boolean)|6737e74fb449e7745b3847b3f95ec0a0|t|search_path=\"\"|postgres|false|f|t|f|f",
              "update_shift(text,jsonb,boolean,integer)|c7b743aa97b19c678ff6f84d6c9b8a2c|t|search_path=\"\"|postgres|∅|t|t|f|f",
          ]
          # Verify expected values against the fixture's annotations at runtime too.
          fixture = Path("rc19-w4-application/tests/fixtures/rc15_production_shift_rpc_baseline.sql")
          if not fixture.exists():
              fixture = Path("tests/fixtures/rc15_production_shift_rpc_baseline.sql")
          import re
          annotated = re.findall(r"^-- Baseline .* pg_get_functiondef md5 ([0-9a-f]{32})$", fixture.read_text(), re.M)
          if len(annotated) != 3:
              raise SystemExit("RC15 baseline fixture annotations are incomplete")
          if annotated != [
              "2133950d90a0610b76d4b6623abf4621",
              "6737e74fb449e7745b3847b3f95ec0a0",
              "c7b743aa97b19c678ff6f84d6c9b8a2c",
          ]:
              raise SystemExit("RC15 fixture annotations changed from the reviewed production baseline")
          print("RC15_PREDECESSOR_RPC_CONTRACT_ACTUAL=" + repr(actual))
          print("RC15_PREDECESSOR_RPC_CONTRACT_EXPECTED=" + repr(expected))
          actual_by_signature = {line.split("|", 1)[0]: line for line in actual}
          expected_by_signature = {line.split("|", 1)[0]: line for line in expected}
          if len(actual_by_signature) != 3 or actual_by_signature != expected_by_signature:
              raise SystemExit("Disposable RC15 bridge metadata or execution privileges differ")
          PY
          cat "$RUNNER_TEMP/rc19-w4-rc15-baseline-contract.txt"
          python3 - "$canonical_migrations" "$bridge_filename" "$RUNNER_TEMP/rc19-w4-before-c2-migrations.txt" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          files = sorted(source.glob("*.sql"), key=lambda item: item.name)
          rc15_target = "20261011092015_rc15_shift_rpc_compatibility.sql"
          c2_target = "20261103195519_rc19_c2_resource_public_and_app_edit.sql"
          names = [path.name for path in files]
          if rc15_target not in names or c2_target not in names:
              raise SystemExit("Canonical RC15 or C2 migration is missing")
          start = names.index(rc15_target)
          c2_index = names.index(c2_target)
          if c2_index <= start or names[c2_index - 1] != "20261103093137_rc19_unified_import_agency_supplemental_fields.sql":
              raise SystemExit("Canonical migration dependency immediately before C2 changed; bridge placement needs review")
          active = Path("supabase/migrations")
          before_c2 = files[start:c2_index]
          if not before_c2 or before_c2[0].name != rc15_target:
              raise SystemExit("Canonical post-RC15 migration batch is empty or misordered")
          Path(sys.argv[3]).write_text("\n".join(path.name for path in before_c2) + "\n")
          for path in before_c2:
              (active / path.name).write_bytes(path.read_bytes())
          PY
          supabase db push --skip-vault > "$RUNNER_TEMP/rc19-w4-post-rc15-before-c2-migrations.log" 2>&1 || {
            capture_supabase_start_failure "$RUNNER_TEMP/rc19-w4-post-rc15-before-c2-migrations.log" "rc15_through_c2_predecessor_migrations"
            echo "::error::RC15 through the canonical C2 predecessor failed in the disposable runtime; sanitized evidence was recorded."; exit 1;
          }
          before_c2_count="$(wc -l < "$RUNNER_TEMP/rc19-w4-before-c2-migrations.txt" | tr -d '[:space:]')"
          [[ "$before_c2_count" =~ ^[0-9]+$ && "$before_c2_count" -gt 0 ]]
          before_c2_receipts="$(docker exec "$database_container_id" psql -U postgres -d postgres -Atqc 'SELECT count(*) FROM supabase_migrations.schema_migrations')"
          [[ "$before_c2_receipts" == "$((predecessor_count + before_c2_count + 1))" ]] || {
            echo "::error::Ledger does not contain exactly the canonical RC15 predecessor and pre-C2 batches plus the RC15 baseline bridge"; exit 1;
          }
          [[ -f "$sto02_baseline_source" ]] || { echo "::error::Pinned harness is missing the reviewed STO-02 baseline source"; exit 1; }
          sto02_source_blob="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD:supabase/proposals/rc19-sto02-resource-registry/20261027150000_rc19_sto02_resource_registry.sql)"
          [[ "$sto02_source_blob" == "74d19f25bb69f463160b17b8bcb5a74437e2ce38" ]] || {
            echo "::error::Pinned STO-02 baseline Git blob differs from the reviewed source"; exit 1;
          }
