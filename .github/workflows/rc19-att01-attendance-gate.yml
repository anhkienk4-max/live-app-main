name: RC19 ATT-01 Attendance Import Gate (no deployment)

on:
  push:
    branches:
      - fix/rc19-att01-attendance-import-clarity-20261027
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - run: |
          corepack enable
          corepack prepare pnpm@10.26.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: TypeScript (whole repository)
        run: pnpm exec tsc --noEmit --incremental false
      - name: ESLint (whole repository)
        run: pnpm run lint
      - name: Attendance focused regression
        run: node --import ./tests/typescript-alias-loader.mjs --test tests/rc19-att01-date-source-contract.test.ts tests/rc17c-historical-attendance-importer.test.ts tests/rc17c-attendance-atomic-rpc-boundary.test.ts tests/rc17c-attendance-api-integration.test.ts
      - name: Full release regression inventory
        env:
          SHOPEE_SCREENSHOT: e2e/fixtures/shopee-dashboard.jpg
          TIKTOK_SCREENSHOT: e2e/fixtures/tiktok-dashboard.jpg
        run: node scripts/run-final-regression.mjs
      - name: Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Attendance 390px and 1440px mock browser workflows
        run: pnpm exec playwright test --config playwright.rc19-attendance.config.ts --reporter=line
      - name: Credential-free production-equivalent build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
          FEATURE_ACTUAL_STAFFING: 'false'
          FEATURE_PAYROLL: 'false'
          OPERATIONAL_STORAGE_ROUTING_MODE: database
        run: pnpm run build
      - name: Provenance and release gate
        if: always()
        run: |
          echo "ATT-01 candidate SHA $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "No database migration, provider write, Production deploy or merge. Authenticated Production UAT outstanding." >> "$GITHUB_STEP_SUMMARY"
