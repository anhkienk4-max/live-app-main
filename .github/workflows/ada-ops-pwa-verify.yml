name: ADA OPS PWA Verify

on:
  push:
    branches:
      - feat/ada-ops-pwa-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify PWA contract
        run: node --test tests/pwa-route-matcher.test.mjs tests/pwa-brand-shell.test.mjs
      - name: Typecheck
        run: pnpm exec tsc --noEmit --incremental false
      - name: Lint PWA files
        run: pnpm exec eslint app/manifest.ts app/layout.tsx app/login/page.tsx app/api/auth/callback/route.ts app/icon.tsx app/icon1/route.ts app/icon2/route.ts app/icon3/route.ts app/apple-icon.tsx app/pwa-splash/route.tsx lib/pwa components/branding/AdaBrand.tsx components/layout/BottomNav.tsx components/layout/Header.tsx components/layout/Sidebar.tsx components/layout/ProductionAppShell.tsx components/layouts/AuthLayout.tsx components/features/dashboard/presentation/member/MemberDashboardView.tsx components/features/dashboard/presentation/member/MemberDashboardMobile.tsx components/features/dashboard/presentation/OperationsMobileHome.tsx components/features/dashboard/presentation/admin/AdminDashboardView.tsx components/features/dashboard/presentation/leader/LeaderDashboardView.tsx components/features/calendar/CalendarView.tsx components/features/reports/ReportDetailModal.tsx "app/(dashboard)/payroll/page.tsx" "app/(dashboard)/profile/page.tsx" "app/(dashboard)/calendar/page.tsx" "app/(dashboard)/reports/page.tsx" "app/(dashboard)/payroll/page.tsx" "app/(dashboard)/profile/page.tsx"
      - name: Production build
        run: pnpm build
      - name: Install Chromium for isolated PWA visual QA
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture and assert Login reference viewports
        run: pnpm exec playwright test --config=playwright.pwa.config.ts
      - name: Validate operational phone screens in credential-free local mock
        run: pnpm exec playwright test --config=playwright.pwa-mobile.config.ts
      - name: Upload PWA four-screen visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ada-ops-pwa-mobile-uat-evidence
          path: |
            test-results/pwa-ops-mobile/*.png
            test-results/**/trace.zip
            test-results/**/test-failed-*.png
          if-no-files-found: warn
      - name: Upload PWA login visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ada-ops-pwa-login-visual-evidence
          path: |
            test-results/pwa-visual/*.png
            test-results/**/trace.zip
            test-results/**/test-failed-*.png
          if-no-files-found: warn
