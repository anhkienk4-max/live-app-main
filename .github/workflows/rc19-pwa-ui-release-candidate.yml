name: ADA OPS RC19 UI-only Production candidate (NO DEPLOY)
on:
  push:
    branches:
      - release/rc19-ui-only-production-candidate-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: UI scope and retained service/auth entrypoints
        run: node scripts/pwa-rc19-ui-release-scope.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Scoped ESLint for changed code
        run: |
          git diff --name-only 1b96f38a17768e96b92f23056efba4b61cc76f84 HEAD | grep -E '\.(tsx?|mjs)$' | grep -v '^app/globals\.css$' | tr '\n' '\0' | xargs -0 -r pnpm exec eslint
      - name: Credential-free Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
          FEATURE_PAYROLL: 'false'
          FEATURE_ACTUAL_STAFFING: 'false'
          OPERATIONAL_STORAGE_ROUTING_MODE: database
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Mock-only login visual QA
        run: pnpm exec playwright test --config=playwright.pwa.config.ts
      - name: Mock-only Dashboard, Staff, and workspace responsive QA
        run: pnpm exec playwright test --config=playwright.pwa-dashboard.config.ts
      - name: Upload mock screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc19-ui-only-mock-screens
          path: |
            test-results/pwa-dashboard/*.png
            test-results/pwa-visual/*.png
          if-no-files-found: warn
      - name: Release safety note
        if: always()
        run: echo 'NO-GO PRODUCTION until exact CLI source parity and authenticated role UAT are evidenced. No deployment from this workflow.' >> "$GITHUB_STEP_SUMMARY"
