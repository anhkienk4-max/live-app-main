name: RC19 W4 Infrastructure Rehearsal (No Deploy)

on:
  push:
    branches:
      - chore/rc19-w4-release-readiness
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to test on the selected ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rc19-w4-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-infrastructure-rehearsal:
    name: Hosted disposable PostgreSQL and Supabase stack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres17:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: rc19_ci
          POSTGRES_PASSWORD: rc19-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rc19_ci -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=18

    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Assert checkout, source head, tested SHA, and dispatch request
        env:
          EVENT_SHA: ${{ github.sha }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_MERGE_SHA: ${{ github.sha }}
          EXPECTED_DISPATCH_SHA: ${{ github.event.inputs.expected_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EVENT_SHA" ]] || { echo "::error::Checkout does not match event SHA"; exit 1; }
          [[ "$actual" == "$TESTED_MERGE_SHA" ]] || { echo "::error::Tested SHA does not match checked out SHA"; exit 1; }
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$actual" != "$EXPECTED_DISPATCH_SHA" ]]; then
            echo "::error::Dispatch SHA does not match the selected ref"
            exit 1
          fi
          {
            echo "Source head SHA: $SOURCE_HEAD_SHA"
            echo "Tested/merge SHA: $TESTED_MERGE_SHA"
            echo "Checked-out SHA: $actual"
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "Expected dispatch SHA: $EXPECTED_DISPATCH_SHA"
            fi
            echo "Deployment: not performed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Initialize sanitized rehearsal manifest
        run: |
          mkdir -p "$RUNNER_TEMP/rc19-w4-artifact"
          printf '{"scope":"infrastructure-only","deployment":false,"steps":{}}\n' > "$RUNNER_TEMP/rc19-w4-artifact/rehearsal.json"

      - name: PostgreSQL 17.11 disposable dump and restore infrastructure smoke
        env:
          PG_CONTAINER_ID: ${{ job.services.postgres17.id }}
          PGUSER: rc19_ci
          PGPASSWORD: rc19-ci-${{ github.run_id }}-${{ github.run_attempt }}
          RUN_MARKER: RC19_W4_HOSTED_INFRA_RUN_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          db_name="rc19_w4_infra_${GITHUB_RUN_ID}"
          docker exec -e PGPASSWORD="$PGPASSWORD" "$PG_CONTAINER_ID"             psql -U "$PGUSER" -d postgres -v ON_ERROR_STOP=1             -c "CREATE DATABASE $db_name"
          docker exec -e PGPASSWORD="$PGPASSWORD" "$PG_CONTAINER_ID"             psql -U "$PGUSER" -d "$db_name" -v ON_ERROR_STOP=1             -c "COMMENT ON DATABASE $db_name IS '$RUN_MARKER'"             -c 'CREATE TABLE public.synthetic_fixture (id integer PRIMARY KEY, marker text NOT NULL)'             -c "INSERT INTO public.synthetic_fixture VALUES (1, '$RUN_MARKER')"
          docker exec -e PGPASSWORD="$PGPASSWORD" "$PG_CONTAINER_ID"             pg_dump -U "$PGUSER" -d "$db_name" --format=custom > "$RUNNER_TEMP/rc19-w4-fixture.dump"
          restore_db="${db_name}_restored"
          docker exec -e PGPASSWORD="$PGPASSWORD" "$PG_CONTAINER_ID"             createdb -U "$PGUSER" "$restore_db"
          docker exec -i -e PGPASSWORD="$PGPASSWORD" "$PG_CONTAINER_ID"             pg_restore -U "$PGUSER" -d "$restore_db" --no-owner < "$RUNNER_TEMP/rc19-w4-fixture.dump"
          marker="$(docker exec -e PGPASSWORD="$PGPASSWORD" "$PG_CONTAINER_ID"             psql -U "$PGUSER" -d "$restore_db" -Atqc 'SELECT marker FROM public.synthetic_fixture WHERE id=1')"
          [[ "$marker" == "$RUN_MARKER" ]] || { echo "::error::Synthetic restore marker mismatch"; exit 1; }
          server_version="$(docker exec -e PGPASSWORD="$PGPASSWORD" "$PG_CONTAINER_ID"             psql -U "$PGUSER" -d postgres -Atqc 'SHOW server_version')"
          [[ "$server_version" == 17.11* ]] || { echo "::error::Expected PostgreSQL 17.11"; exit 1; }
          rm -f "$RUNNER_TEMP/rc19-w4-fixture.dump"
          jq --arg pg "$server_version" --arg db "$db_name" --arg marker "$RUN_MARKER"             '.steps.postgres = {status:"passed", version:$pg, database:$db, marker:$marker, dump_restore:"synthetic infrastructure smoke only"}'             "$RUNNER_TEMP/rc19-w4-artifact/rehearsal.json" > "$RUNNER_TEMP/rehearsal.json"
          mv "$RUNNER_TEMP/rehearsal.json" "$RUNNER_TEMP/rc19-w4-artifact/rehearsal.json"
          echo "PostgreSQL synthetic dump/restore infrastructure smoke passed. This is not Official Restore acceptance." >> "$GITHUB_STEP_SUMMARY"

      - name: Install checksum-pinned Supabase CLI 3.4.0
        env:
          CLI_SHA256: d82f8fc8a1611c45b9422b10378f61df614325f7e25624acda3704544513d6ac
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/supabase_3.4.0_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location             https://github.com/supabase/cli/releases/download/v3.4.0/supabase_3.4.0_linux_amd64.tar.gz             --output "$archive"
          echo "$CLI_SHA256  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/supabase-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/supabase-cli" supabase
          echo "$RUNNER_TEMP/supabase-cli" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/supabase-cli/supabase" --version

      - name: Fresh Supabase bootstrap, GoTrue cold start, and synthetic login
        env:
          RUN_MARKER: RC19_W4_AUTH_RUN_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rc19-w4-supabase"
          mkdir -p "$root"
          cd "$root"
          supabase init
          supabase config convert --to toml
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("supabase/config.toml")
          text = path.read_text()
          def replace_section_value(section, key, value):
              global text
              match = re.search(rf"(?ms)^\[{re.escape(section)}\]\n(.*?)(?=^\[|\Z)", text)
              if not match:
                  raise SystemExit(f"Missing Supabase config section: {section}")
              body = match.group(1)
              if re.search(rf"(?m)^\s*{re.escape(key)}\s*=", body):
                  body = re.sub(rf"(?m)^\s*{re.escape(key)}\s*=.*$", f"{key} = {value}", body)
              else:
                  body = f"{key} = {value}\n" + body
              text = text[:match.start(1)] + body + text[match.end(1):]
          replace_section_value("db", "major_version", "17")
          replace_section_value("db", "port", "55432")
          replace_section_value("api", "port", "55421")
          replace_section_value("auth", "enable_signup", "true")
          replace_section_value("auth.email", "enable_confirmations", "false")
          path.write_text(text)
          PY
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1 || {
            echo "::error::Fresh Supabase CLI stack failed to start; raw logs withheld."
            exit 1
          }
          status_file="$RUNNER_TEMP/supabase-status.env"
          supabase status -o env > "$status_file"
          set -a
          # The file is produced by the pinned local CLI; values stay in this step.
          source "$status_file"
          set +a
          for secret in "${ANON_KEY:-}" "${SERVICE_ROLE_KEY:-}" "${SECRET_KEY:-}" "${JWT_SECRET:-}" "${PUBLISHABLE_KEY:-}" "${DB_URL:-}"; do
            [[ -z "$secret" ]] || echo "::add-mask::$secret"
          done
          api_url="${API_URL:-http://127.0.0.1:55421}"
          db_url="${DB_URL:?Supabase CLI did not expose DB_URL}"
          anon_key="${ANON_KEY:?Supabase CLI did not expose ANON_KEY}"
          curl --fail --silent --show-error "$api_url/auth/v1/health" > /dev/null
          docker run --rm --network host -e DB_URL="$db_url" -e RUN_MARKER="$RUN_MARKER" postgres:17.11-alpine psql "$db_url" -v ON_ERROR_STOP=1 <<SQL
          COMMENT ON DATABASE postgres IS '$RUN_MARKER';
          CREATE TABLE public.rc19_w4_runtime_probe (marker text PRIMARY KEY);
          INSERT INTO public.rc19_w4_runtime_probe VALUES ('$RUN_MARKER');
          GRANT SELECT ON public.rc19_w4_runtime_probe TO authenticated;
          SQL
          email="synthetic+${GITHUB_RUN_ID}@example.test"
          password="rc19-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-Aa9!"
          echo "::add-mask::$password"
          curl --fail --silent --show-error -X POST "$api_url/auth/v1/signup" \
            -H "apikey: $anon_key" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password}')" > /dev/null
          check_sql="SELECT (current_database() = 'postgres' AND shobj_description(oid, 'pg_database') = '$RUN_MARKER' AND EXISTS (SELECT 1 FROM auth.users WHERE email = '$email')) FROM pg_database WHERE datname = current_database()"
          auth_connection_ok="$(docker run --rm --network host -e DB_URL="$db_url" -e CHECK_SQL="$check_sql" postgres:17.11-alpine sh -ec 'psql "$DB_URL" -Atqc "$CHECK_SQL"')"
          [[ "$auth_connection_ok" == "t" ]] || { echo "::error::Auth synthetic user was not persisted in the marker database"; exit 1; }
          access_token="$(curl --fail --silent --show-error -X POST "$api_url/auth/v1/token?grant_type=password" \
            -H "apikey: $anon_key" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password}')" | jq -er '.access_token')"

          echo "::add-mask::$access_token"
          result="$(curl --fail --silent --show-error "$api_url/rest/v1/rc19_w4_runtime_probe?select=marker"             -H "apikey: $anon_key" -H "Authorization: Bearer $access_token")"
          [[ "$(jq -r '.[0].marker' <<< "$result")" == "$RUN_MARKER" ]] || {
            echo "::error::Authenticated PostgREST marker validation failed"; exit 1;
          }
          auth_image="$(docker ps --format '{{.Image}}' | grep 'gotrue' | head -n 1 || true)"
          rest_image="$(docker ps --format '{{.Image}}' | grep 'postgrest' | head -n 1 || true)"
          [[ -n "$auth_image" && -n "$rest_image" ]] || {
            echo "::error::GoTrue or PostgREST container was not observed"; exit 1;
          }
          runtime_db_version="$(docker run --rm --network host -e DB_URL="$db_url" postgres:17.11-alpine psql "$db_url" -Atqc 'SHOW server_version')"
          connection_identity="$(python3 -c 'import sys; from urllib.parse import urlsplit; u=urlsplit(sys.argv[1]); print(f"{u.hostname}:{u.port}{u.path}")' "$db_url")"
          jq --arg marker "$RUN_MARKER" --arg auth "$auth_image" --arg rest "$rest_image" --arg dbversion "$runtime_db_version" --arg identity "$connection_identity"             '.steps.supabase = {status:"passed", database:"postgres", marker:$marker, connection_identity:$identity, postgres_version:$dbversion, gotrue_image:$auth, postgrest_image:$rest, auth_same_database_marker_check:true, synthetic_signup_login:true, jwt_postgrest_read:true}'             "$RUNNER_TEMP/rc19-w4-artifact/rehearsal.json" > "$RUNNER_TEMP/rehearsal.json"
          mv "$RUNNER_TEMP/rehearsal.json" "$RUNNER_TEMP/rc19-w4-artifact/rehearsal.json"
          echo "Fresh pinned Supabase CLI stack cold-started; synthetic Auth login and authenticated PostgREST marker read passed." >> "$GITHUB_STEP_SUMMARY"
          supabase stop --no-backup > /dev/null 2>&1 || true

      - name: Upload sanitized infrastructure-only manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc19-w4-infrastructure-${{ github.run_id }}
          path: ${{ runner.temp }}/rc19-w4-artifact/rehearsal.json
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup disposable Supabase stack
        if: always()
        run: |
          if [[ -x "$RUNNER_TEMP/supabase-cli/supabase" && -d "$RUNNER_TEMP/rc19-w4-supabase/supabase" ]]; then
            cd "$RUNNER_TEMP/rc19-w4-supabase"
            "$RUNNER_TEMP/supabase-cli/supabase" stop --no-backup >/dev/null 2>&1 || true
          fi
