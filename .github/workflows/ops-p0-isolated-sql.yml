name: OPS P0 Isolated SQL and RLS Performance Experiment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ops-p0-isolated-sql.yml'
      - 'tests/rc16k-pagination-postgres.integration.mjs'
      - 'scripts/performance/candidates/**'
      - 'supabase/migrations/20261012171503_rc16k_bounded_shift_lists.sql'
      - 'supabase/migrations/20260814085659_p1c_shift_persistence.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-parity:
    name: Synthetic PG${{ matrix.postgres }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '16'
            node: '22.23.3'
          - postgres: '17'
            node: '24.18.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Isolated role-parity, rollback and synthetic explain
        env:
          RC16_PG_MAJOR: ${{ matrix.postgres }}
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: postgres
        run: node tests/rc16k-pagination-postgres.integration.mjs

      - name: Capture provenance in job summary
        if: always()
        run: |
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Synthetic isolated database only. No Production or Staging mutations." >> "$GITHUB_STEP_SUMMARY"
          echo "Single EXPLAIN execution is exploratory, NOT a statistically valid speedup." >> "$GITHUB_STEP_SUMMARY"
