name: RC19 BI-01 Analytics Composer Source Gate (NO DEPLOY)
on:
  push:
    branches:
      - feat/rc19-bi01-analytics-composer-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bi01:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - run: |
          corepack enable
          corepack prepare pnpm@10.26.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: ESLint
        run: pnpm run lint
      - name: BI-01 catalog, compatibility and security-boundary tests
        run: node --import ./tests/typescript-alias-loader.mjs --test tests/bi01-catalog.test.ts
      - name: Full repository regression
        env:
          SHOPEE_SCREENSHOT: e2e/fixtures/shopee-dashboard.jpg
          TIKTOK_SCREENSHOT: e2e/fixtures/tiktok-dashboard.jpg
        run: node scripts/run-final-regression.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Analytics composer responsive mock (NOT authenticated UAT)
        run: pnpm exec playwright test --config playwright.rc19-bi01.config.ts --reporter=line
      - name: Guarded source build, no credentials
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
          FEATURE_ATTENDANCE_IMPORT: 'false'
          NEXT_PUBLIC_FEATURE_ATTENDANCE_IMPORT: 'false'
          OPERATIONAL_STORAGE_ROUTING_MODE: database
        run: pnpm run build
      - name: Candidate SHA and NO DEPLOY proof
        if: always()
        run: |
          echo "RC19 BI-01 candidate $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow does not deploy, migrate, or access Production data." >> "$GITHUB_STEP_SUMMARY"
