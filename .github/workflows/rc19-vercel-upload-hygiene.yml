name: RC19 Vercel CLI upload hygiene (STATIC / NO DEPLOY)
on:
  push:
    branches:
      - chore/rc19-vercel-upload-hygiene-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Static Vercel ignore contract
        run: node scripts/assert-vercel-upload-hygiene.mjs
      - name: Git ignores local nested worktrees
        run: git check-ignore -v --no-index .worktrees/rc19-pass-swap-93/package.json
      - name: Restrict this PR to source-upload hygiene
        run: |
          node - <<'NODE'
          const {execFileSync}=require('node:child_process')
          const base='1befe23bea9380dac37061a7132ac38143cf678b'
          const paths=execFileSync('git',['diff','--name-only',base,'HEAD'],{encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean)
          const allowed=new Set(['.vercelignore','.gitignore','scripts/assert-vercel-upload-hygiene.mjs','docs/releases/RC19_VERCEL_UPLOAD_CONTEXT_HYGIENE.md','.github/workflows/rc19-vercel-upload-hygiene.yml'])
          for(const p of paths){if(!allowed.has(p))throw Error('Runtime source modification is blocked: '+p)}
          if(paths.length!==5)throw Error('Expected exactly 5 upload-hygiene files, got '+paths.length)
          console.log('No runtime source changes. STATIC CHECK ONLY. Real isolated CLI Preview upload still required.')
          NODE
      - name: Release hold
        if: always()
        run: echo 'NO PRODUCTION DEPLOY. Static ignore check is not proof of a clean Vercel source upload.' >> "$GITHUB_STEP_SUMMARY"
