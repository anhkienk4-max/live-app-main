name: RC19 Staffing 73 PostgreSQL 17 gate

on:
  push:
    branches: [fix/rc19-staffing-73]

permissions:
  contents: read

jobs:
  staffing-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert exact pushed commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start isolated PostgreSQL 17
        run: |
          docker run --detach --rm --name ada-staffing-pg17 --network none \
            -e POSTGRES_PASSWORD=synthetic-only postgres:17.11-bookworm
          for attempt in $(seq 1 30); do
            if docker exec ada-staffing-pg17 pg_isready -U postgres -d postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs ada-staffing-pg17
          exit 1
      - name: Run Staffing PostgreSQL 17 role/filter/totals gate
        env:
          STAFFING_PG_CONTAINER: ada-staffing-pg17
        run: node tests/rc19-staffing-role-filter-postgres.integration.mjs
      - name: Run existing Staffing contract tests
        run: node --import ./tests/typescript-alias-loader.mjs --test tests/rc19-staffing-role-filter.test.ts tests/rc19-staffing-candidate-contract.test.ts tests/rc19-staffing-failclosed.test.ts
      - name: Stop isolated database
        if: always()
        run: docker stop ada-staffing-pg17 || true
      - name: No deployment declaration
        run: 'echo "NO DEPLOY: this workflow only runs synthetic PostgreSQL 17 and source tests."'
