name: ATT-01 PostgreSQL 17 concurrent import proof (NO DEPLOY)
on:
  push:
    branches:
      - fix/att01-concurrent-rpc-review-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres17:
    name: Baseline races + review SQL fix (disposable PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL CLI for isolated CI container
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres
      - name: Concurrent regression on REAL isolated PostgreSQL 17
        run: python3 tests/att01-concurrency/concurrent_postgres17.py
      - name: Review-only run provenance
        if: always()
        run: |
          echo "ATT-01 P0 concurrency proof SHA $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow used ONLY disposable PostgreSQL 17 CI service databases. No Vercel, Supabase, Production migrations, credentials or deployed application were changed." >> "$GITHUB_STEP_SUMMARY"
