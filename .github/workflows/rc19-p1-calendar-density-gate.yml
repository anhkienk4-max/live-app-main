name: RC19 P1 Calendar Density (no preview, no deployment)

on:
  push:
    branches:
      - fix/rc19-p1-calendar-density-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - run: |
          corepack enable
          corepack prepare pnpm@10.26.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: Full ESLint
        run: pnpm run lint
      - name: Month Calendar data integrity regression
        run: node --import ./tests/typescript-alias-loader.mjs --test tests/calendar-business-month-contract.test.ts
      - name: Full source regression
        env:
          SHOPEE_SCREENSHOT: e2e/fixtures/shopee-dashboard.jpg
          TIKTOK_SCREENSHOT: e2e/fixtures/tiktok-dashboard.jpg
        run: node scripts/run-final-regression.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Calendar responsive Month/Week Chromium
        run: pnpm exec playwright test --config playwright.rc19-calendar.config.ts --reporter=line
      - name: Next production-equivalent build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
          FEATURE_ACTUAL_STAFFING: 'false'
          FEATURE_PAYROLL: 'false'
          OPERATIONAL_STORAGE_ROUTING_MODE: database
        run: pnpm run build
      - name: Provenance
        if: always()
        run: |
          echo "RC19 P1 candidate SHA $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "This is mock-only responsive verification. NO PREVIEW, NO Production deployment." >> "$GITHUB_STEP_SUMMARY"
