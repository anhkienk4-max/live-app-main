name: P0 Hotfix Executor Proof

on:
  push:
    branches:
      - test/p0-hotfix-executor-proof
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-hotfix-executor-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  executor-proof:
    name: Synthetic PostgreSQL 17 executor contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Record exact synthetic test target
        shell: pwsh
        run: |
          "GITHUB_SHA=$env:GITHUB_SHA" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "GITHUB_REF=$env:GITHUB_REF" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "PRODUCTION_CONNECTIONS=NONE" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "PRODUCTION_SECRETS=NONE" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Prove isolated executor contract only
        shell: pwsh
        run: ./scripts/release/p0-hotfix-executor-proof.ps1

