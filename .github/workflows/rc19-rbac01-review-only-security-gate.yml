name: RC19 RBAC-01 Review-Only Security Gate (NO DEPLOY)
on:
  push:
    branches:
      - feat/rc19-rbac01-role-permissions
      - feat/rc19-rbac-security-20261029
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rbac01:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.18.0'
      - run: |
          corepack enable
          corepack prepare pnpm@10.26.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit --incremental false
      - name: ESLint
        run: pnpm run lint
      - name: Focused RBAC legacy security + API forgery and defaults
        run: node --import ./tests/typescript-alias-loader.mjs --test tests/rc19-rbac01-security.test.ts tests/core-v1-3role-matrix.test.ts tests/h51-rbac-negative-security.test.ts tests/rc16-ui-navigation-rbac.test.ts
      - name: Disposable PostgreSQL 17 RBAC proposal, auth role and RLS proof
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -X -v ON_ERROR_STOP=1 -c "SELECT current_setting('server_version_num')"
          psql -X -v ON_ERROR_STOP=1 -f tests/rbac01/pg17_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/rbac01/RC19_RBAC01_REVIEW_ONLY.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/rbac01/pg17_assertions.sql
      - name: Full repository regression
        env:
          SHOPEE_SCREENSHOT: e2e/fixtures/shopee-dashboard.jpg
          TIKTOK_SCREENSHOT: e2e/fixtures/tiktok-dashboard.jpg
        run: node scripts/run-final-regression.mjs
      - name: Guarded build no credentials or RBAC activation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_URL: ''
          SUPABASE_SECRET_KEY: ''
          FEATURE_RBAC01_ROLE_DEFAULTS: 'false'
          NEXT_PUBLIC_FEATURE_RBAC01_ROLE_DEFAULTS: 'false'
          FEATURE_ATTENDANCE_IMPORT: 'false'
          NEXT_PUBLIC_FEATURE_ATTENDANCE_IMPORT: 'false'
          OPERATIONAL_STORAGE_ROUTING_MODE: database
        run: pnpm run build
      - name: Source SHA proof only, never deploy
        if: always()
        run: |
          echo "RBAC01 review-only candidate $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "PROPOSALS ONLY; approved role defaults/enforcement NOT ACTIVATED; no Production SQL/data/dev env touched." >> "$GITHUB_STEP_SUMMARY"
